name: Doc2/Doc3 현황 업데이트

on:
  schedule:
    # 평일(월~금) 매일 오전 10:00 KST (= 01:00 UTC)
    - cron: '0 1 * * 1-5'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  update-doc2-doc3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install --no-cache-dir -r requirements.txt

      - name: Doc2 업데이트
        env:
          JIRA_EMAIL:              ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:          ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_EMAIL:        ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN:    ${{ secrets.CONFLUENCE_API_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_FIELD_COUNTRY:      ${{ secrets.JIRA_FIELD_COUNTRY }}
          JIRA_FIELD_BRD_STATUS:   ${{ secrets.JIRA_FIELD_BRD_STATUS }}
          JIRA_FIELD_FEATURE_TYPE: ${{ secrets.JIRA_FIELD_FEATURE_TYPE }}
        run: python main.py --doc2

      - name: Doc3 업데이트
        env:
          JIRA_EMAIL:              ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:          ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_EMAIL:        ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN:    ${{ secrets.CONFLUENCE_API_TOKEN }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_FIELD_COUNTRY:      ${{ secrets.JIRA_FIELD_COUNTRY }}
          JIRA_FIELD_BRD_STATUS:   ${{ secrets.JIRA_FIELD_BRD_STATUS }}
          JIRA_FIELD_FEATURE_TYPE: ${{ secrets.JIRA_FIELD_FEATURE_TYPE }}
        run: python main.py --doc3
